name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: localclash-luci-ci-${{ github.ref }}
  cancel-in-progress: true

# 源码、构建和资产检查不替代推送发布 tag 前的人工 iStoreOS QEMU 功能门槛。
# https://github.com/qoli/localClash/blob/main/docs/istoreos-release-test-sop.md
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare pinned dnsqualify source
        run: python3 scripts/prepare-dnsqualify-source.py

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .build/dnsqualify-source/go.mod
          cache: false

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          for file in openwrt/luci-app-localclash/htdocs/luci-static/resources/view/localclash/*.js; do
            node --check "$file"
          done
          node scripts/test-takeover-issue-report.js
          node scripts/test-custom-sites-ui.js
          node scripts/test-dashboard-ui.js
          node scripts/test-subscription-ui.js
          node scripts/test-one-click-update-ui.js
          node scripts/test-runtime-restart-ui.js
          sh -n openwrt/luci-app-localclash/root/usr/libexec/rpcd/localclash
          sh -n packaging/istore/install.sh
          python3 -m py_compile scripts/generate-release-notes.py
          python3 -m py_compile scripts/resolve-core-release.py
          python3 -m py_compile scripts/prepare-dnsqualify-source.py
          python3 -m unittest scripts/test_generate_release_notes.py scripts/test_resolve_core_release.py scripts/test_prepare_dnsqualify_source.py
          release_tag="$(awk -F':=' '/^PKG_VERSION:=/ { version=$2 } /^PKG_RELEASE:=/ { release=$2 } END { print "v" version "-" release }' openwrt/luci-app-localclash/Makefile)"
          scripts/generate-release-notes.py "$release_tag" /tmp/localclash-luci-release-notes.md
          git diff --check

      - name: Test dnsqualify
        working-directory: .build/dnsqualify-source
        run: |
          go test ./...
          go vet ./...

      - name: Test rpcd helpers
        shell: bash
        run: |
          set -euo pipefail
          for test_script in scripts/test-rpcd-*.sh scripts/test-hotplug-takeover-restore.sh; do
            bash -n "$test_script"
            bash "$test_script"
          done

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="$(awk -F':=' '/^PKG_VERSION:=/ { version=$2 } /^PKG_RELEASE:=/ { release=$2 } END { print "v" version "-" release }' openwrt/luci-app-localclash/Makefile)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          scripts/build-release-assets.sh "$tag"

      - name: Upload package candidates
        uses: actions/upload-artifact@v4
        with:
          name: localclash-luci-candidate-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
